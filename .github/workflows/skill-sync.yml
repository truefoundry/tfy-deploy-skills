name: skill-sync

# HARD RULE: manual invocation ONLY. No `schedule:` trigger.
# skill-sync rewrites docs in this repo; it must never run without a human
# explicitly starting it. To run: GitHub Actions tab → skill-sync → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without opening a PR (prints drift to the action log)."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: skill-sync
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck
          # gh is preinstalled on ubuntu-latest runners

      - name: Configure git identity
        run: |
          git config user.name "truefoundry-skill-sync[bot]"
          git config user.email "skill-sync@users.noreply.github.com"

      - name: Run skill-sync (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          DRY_RUN: "1"
        run: bash skills/skill-sync/scripts/run-sync.sh

      - name: Run skill-sync (full)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash skills/skill-sync/scripts/run-sync.sh
